[package]
name = "margin-desktop"
version = "0.19.0"
description = "Local-first manuscript review with human-controlled AI proposals"
authors = ["Becomingw"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "margin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "margin"
path = "src/main.rs"
# The desktop GUI binary needs the desktop stack; headless builds
# (`--no-default-features`) skip it.
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = [
  "dep:axum",
  "dep:tauri",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-fs",
  "dep:tauri-plugin-opener",
  "dep:rmcp",
  "dep:schemars",
  "dep:windows",
]
# Retained source only; never enable for Margin installers. Separate assemblies
# also avoid generating two embedded macOS Info.plist symbols in one binary.
legacy-workbench = [
  "desktop",
  "dep:agent-client-protocol",
  "dep:tauri-plugin-deep-link",
  "dep:tauri-plugin-log",
  "dep:tauri-plugin-shell",
  "dep:tauri-plugin-store",
  "dep:tauri-plugin-updater",
  "dep:tauri-plugin-process",
  "dep:tauri-plugin-single-instance",
  "dep:tauri-specta",
  "dep:specta-typescript",
  "dep:webview2-com",
  "dep:regex",
  "dep:tokio-util",
  "dep:dirs",
  "dep:thiserror",
  "dep:which",
  "dep:rusqlite",
  "dep:reqwest",
  "dep:chrono",
  "dep:flate2",
  "dep:tar",
  "dep:zip",
  "dep:htmd",
  "dep:notify-debouncer-full",
  "dep:async-trait",
  "dep:sha2",
  "dep:hex",
  "dep:walkdir",
  "dep:encoding_rs",
  "dep:urlencoding",
  "dep:url",
  "dep:crypto_box",
  "dep:ed25519-dalek",
  "dep:futures-util",
  "dep:tokio-tungstenite",
  "dep:fontdb",
  "dep:liteparse",
  "dep:liteparse-pdfium",
  "dep:openssh",
  "dep:openssh-sftp-client",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# `start_paused` virtual clock for stream coalescer / throttle unit tests.
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dependencies]
regex = { version = "1", optional = true }
# Tauri-independent foundations (errors, fs, http, paths, sqlite, usage log),
# re-exported as `crate::core::*`. Must stay free of tauri/wry/tao.
margin-core = { path = "../crates/margin-core" }
tauri = { version = "2", features = ["unstable"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri-plugin-fs = { version = "2.5.1", optional = true }
tauri-plugin-shell = { version = "2.3.5", optional = true }
tauri-plugin-store = { version = "2.4.3", optional = true }
tauri-plugin-dialog = { version = "2.7.1", optional = true }
tauri-plugin-deep-link = { version = "2.4.9", optional = true }
agent-client-protocol = { version = "1.2.0", features = ["unstable_elicitation"], optional = true }
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread", "macros", "time", "process", "io-util", "net"] }
# Per-job CancellationToken for the JobCenter cancel path (no global flag state).
tokio-util = { version = "0.7", default-features = false, optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"], optional = true }
# Streamable HTTP MCP server (Settings toggle; loopback only).
rmcp = { version = "3.1", optional = true, default-features = false, features = [
  "server",
  "macros",
  "schemars",
  "transport-streamable-http-server",
] }
schemars = { version = "1", optional = true }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = { workspace = true, optional = true }
thiserror = { version = "2", optional = true }
which = { version = "7", optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "multipart", "cookies"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"], optional = true }
flate2 = { version = "1.1.9", optional = true }
tar = { version = "0.4.46", optional = true }
zip = { version = "2.4", default-features = false, features = ["deflate"], optional = true }
htmd = { version = "0.5.4", optional = true }
notify-debouncer-full = { version = "0.3", optional = true }
log = { workspace = true }
tauri-plugin-log = { version = "2.9.0", optional = true }
async-trait = { version = "0.1.91", optional = true }
sha2 = { version = "0.11.0", optional = true }
hex = { version = "0.4.3", optional = true }
walkdir = { version = "2.5.0", optional = true }
base64 = "0.22"
encoding_rs = { version = "0.8", optional = true }
urlencoding = { version = "2", optional = true }
url = { version = "2", optional = true }
crypto_box = { version = "0.9", optional = true }
ed25519-dalek = { version = "2", optional = true }
# Used by lookup batch import (all platforms); also needed by Unix remote vault.
futures-util = { version = "0.3.33", optional = true }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"], optional = true }
specta = { version = "2.0.0-rc.22", features = ["derive", "chrono"] }
specta-typescript = { version = "0.0.12", optional = true }
fontdb = { version = "0.23", optional = true }

# Updates and process relaunch are desktop-only. Mobile distribution is owned by
# its app stores, not the in-app updater.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"], optional = true }

# LiteParse relies on a desktop PDFium binary. Mobile (iOS/Android) uses the
# paired desktop Host for PDF parsing instead of packaging PDFium in the app.
# Keep this cfg in sync with the gates in src/features/import/pdf_parse/mod.rs
# — desktop (incl. Windows) needs it.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
liteparse = { version = "2.13", optional = true }
# The PDFium binding liteparse itself sits on (shared dylib, one global loader).
# `features/pdf_locate` uses the text engine directly for quote → page rects,
# bypassing liteparse's layout pass.
liteparse-pdfium = { version = "1.7", optional = true }


[target.'cfg(target_os = "ios")'.dependencies]
security-framework = "3.7"
security-framework-sys = "2.17"

[target.'cfg(windows)'.dependencies]
webview2-com = { version = "0.38", optional = true }
windows = { version = "0.61", optional = true, features = [
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# openssh / sendfd are Unix-only (ControlMaster fd passing). Remote vault SFTP
# is therefore unavailable on Windows until a portable backend lands.
[target.'cfg(unix)'.dependencies]
openssh = { version = "0.11.6", features = ["native-mux"], optional = true }
openssh-sftp-client = { version = "0.15.7", features = ["openssh"], optional = true }
