name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: TypeScript (${{ matrix.task }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task:
          - quality
          - test-1
          - test-2
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Assert MCP-only desktop packaging
        if: matrix.task == 'quality'
        run: |
          set -euo pipefail
          node --input-type=commonjs -e "
            const conf = require('./src-tauri/tauri.conf.json');
            const bins = conf.bundle && conf.bundle.externalBin;
            if (bins?.length || conf.build.beforeBuildCommand.includes('cli:')) {
              console.error('Desktop packages expose business operations through MCP, without sidecars');
              process.exit(1);
            }
            for (const platform of ['ios', 'android']) {
              const mobile = require('./src-tauri/tauri.' + platform + '.conf.json');
              if (mobile.bundle.externalBin?.length) throw new Error('Mobile must not bundle desktop sidecars');
            }
          "
      - name: Run TypeScript checks
        run: |
          set -euo pipefail
          case "${{ matrix.task }}" in
            quality)
              pnpm exec biome ci .
              pnpm typecheck
              pnpm deps:check
              ;;
            test-1)
              pnpm exec vitest run --shard=1/2
              ;;
            test-2)
              pnpm exec vitest run --shard=2/2
              ;;
            *)
              echo "::error::Unknown TypeScript CI task: ${{ matrix.task }}"
              exit 1
              ;;
          esac

  rust:
    name: Rust (${{ matrix.task }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        task:
          - quality
          - edda-tests
          - core-tests
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Provision PDFium
        shell: bash
        run: |
          set -euo pipefail
          # liteparse-pdfium-sys fetches PDFium in its build script into an OS
          # cache dir that Swatinem/rust-cache does not persist. On a cache hit
          # the build script is skipped, so libpdfium.dylib is absent when tests
          # dlopen it. Provision it explicitly and point both the build script
          # and the runtime loader at a stable directory. Keep the tag in sync
          # with liteparse-pdfium-sys (currently chromium/7897).
          tag="chromium/7897"
          case "$(uname -m)" in
            arm64 | aarch64) asset="pdfium-mac-arm64" ;;
            *) asset="pdfium-mac-x64" ;;
          esac
          dest="$RUNNER_TEMP/pdfium"
          mkdir -p "$dest"
          url="https://github.com/run-llama/pdfium-binaries/releases/download/${tag/\//%2F}/${asset}.tgz"
          echo "Downloading $url"
          curl -fsSL "$url" | tar -xz -C "$dest"
          test -f "$dest/lib/libpdfium.dylib"
          test -d "$dest/include"
          echo "PDFIUM_LIB_PATH=$dest/lib" >> "$GITHUB_ENV"
          echo "PDFIUM_INCLUDE_PATH=$dest/include" >> "$GITHUB_ENV"
          # tauri.macos.conf.json lists pdfium/libpdfium.dylib under
          # bundle.macOS.frameworks; tauri-build hard-fails when the file is
          # missing even for clippy/tests that never bundle.
          mkdir -p src-tauri/pdfium
          cp "$dest/lib/libpdfium.dylib" src-tauri/pdfium/libpdfium.dylib
      - name: Run Rust checks
        run: |
          set -euo pipefail
          case "${{ matrix.task }}" in
            quality)
              cargo fmt --all --check
              cargo clippy --workspace --all-targets -- -D warnings
              ;;
            edda-tests)
              cargo test -p edda
              ;;
            core-tests)
              cargo test -p edda-core
              ;;
            *)
              echo "::error::Unknown Rust CI task: ${{ matrix.task }}"
              exit 1
              ;;
          esac
