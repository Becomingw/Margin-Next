name: Relay verified Windows candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
      run_id:
        description: Successful Windows candidate workflow run
        type: string
        required: true
      release_id:
        description: Temporary draft Release ID (published Releases are rejected)
        type: string
        required: true

permissions:
  actions: read
  contents: write

jobs:
  relay:
    if: github.repository == 'Becomingw/Edda'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.run_id }}
      DRAFT_RELEASE: ${{ inputs.release_id }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate provenance and draft destination
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ && "$DRAFT_RELEASE" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > run.json
          gh api "repos/$GITHUB_REPOSITORY/releases/$DRAFT_RELEASE" > destination.json
          jq -e '.conclusion == "success" and .path == ".github/workflows/release-windows.yml"' run.json
          jq -e '.draft == true' destination.json
          echo "DRAFT_TAG=$(jq -r .tag_name destination.json)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          name: windows-${{ inputs.tag }}
          path: candidate

      - name: Verify candidate checksums and updater signature
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {createHash,createPublicKey,verify} from 'node:crypto';
          import assert from 'node:assert/strict';
          const read=name=>fs.readFileSync(`candidate/${name}`);
          const evidence=JSON.parse(read('build-evidence.json'));
          const sha=execFileSync('git',['-C','source','rev-parse','HEAD'],{encoding:'utf8'}).trim();
          assert.equal(evidence.sourceSha,sha);
          assert.equal(evidence.tag,process.env.RELEASE_TAG);
          assert.equal(evidence.installerExitCode,0);
          assert.ok(evidence.mcpTestsPassed && evidence.guiSurvivedStartup);
          for(const line of read('SHA256SUMS-windows').toString().trim().split(/\r?\n/)) {
            const [digest,name]=line.split('  ');
            assert.ok(name && !/[\\/]/.test(name));
            assert.equal(createHash('sha256').update(read(name)).digest('hex'),digest);
          }
          const installers=fs.readdirSync('candidate').filter(name=>name.endsWith('-setup.exe'));
          assert.equal(installers.length,1);
          const name=installers[0];
          const config=JSON.parse(fs.readFileSync('source/src-tauri/tauri.conf.json','utf8'));
          const publicLines=Buffer.from(config.plugins.updater.pubkey,'base64').toString().trim().split('\n');
          const key=Buffer.from(publicLines[1],'base64');
          const lines=Buffer.from(read(name+'.sig').toString().trim(),'base64').toString().trim().split('\n');
          const signature=Buffer.from(lines[1],'base64');
          assert.equal(key.length,42);
          assert.equal(signature.length,74);
          assert.deepEqual(key.subarray(2,10),signature.subarray(2,10));
          const publicKey=createPublicKey({key:Buffer.concat([Buffer.from('302a300506032b6570032100','hex'),key.subarray(10)]),format:'der',type:'spki'});
          assert.equal(signature.subarray(0,2).toString(),'ED');
          const message=createHash('blake2b512').update(read(name)).digest();
          assert.ok(verify(null,message,publicKey,signature.subarray(10)));
          assert.ok(lines[2].startsWith('trusted comment: '));
          assert.ok(verify(null,Buffer.concat([signature.subarray(10),Buffer.from(lines[2].slice(17))]),publicKey,Buffer.from(lines[3],'base64')));
          console.log('Verified source SHA, checksums and updater signature.',evidence);
          NODE

      - name: Upload to temporary draft only
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$DRAFT_RELEASE" --jq '.draft' | grep -qx true
          gh release upload "$DRAFT_TAG" candidate/* --repo "$GITHUB_REPOSITORY"
